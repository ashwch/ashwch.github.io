  <path d="M 250 602 H 298" class="line"/>

  <path d="M 1085 190 H 1178 V 563 H 932" class="line"/>
  <text x="1085" y="405" class="detail">Registered Host</text>
  <text x="1085" y="431" class="small">Loopback router</text>
  <text x="1085" y="455" class="small">port 80 or 1355</text>

  <path d="M 420 597 V 655 H 465 V 688" class="line"/>
  <path d="M 420 655 H 780 V 688" class="line"/>
  <rect x="540" y="642" width="171" height="24" fill="#fcf8ff"/>
  <text x="625" y="660" class="small">Owns the processes</text>
  <path d="M 840 597 V 688" class="line"/>
  <text x="984" y="662" class="small">Routes to matching stack</text>

  <rect x="300" y="690" width="300" height="126" rx="10" class="stack"/>
  <text x="450" y="720" class="heading">Worktree A</text>
  <text x="450" y="748" class="small">Frontend · backend · workers</text>
  <text x="450" y="775" class="detail">Own PostgreSQL + Redis</text>
  <text x="450" y="801" class="small">Own ports, URLs and .dev-data/</text>
  <rect x="630" y="690" width="330" height="126" rx="10" class="stack"/>
  <text x="795" y="720" class="heading">Worktree B</text>
  <text x="795" y="748" class="small">Frontend · backend · workers</text>
  <text x="795" y="775" class="detail">Own PostgreSQL + Redis</text>
  <text x="795" y="801" class="small">Own ports, URLs and .dev-data/</text>

  <text x="630" y="845" class="small">Worktree separation is not a security sandbox: services run as the same OS user.</text>
</svg>
