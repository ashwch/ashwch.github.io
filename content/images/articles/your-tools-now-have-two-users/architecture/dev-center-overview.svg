  <text x="465" y="369" class="small">Buttons and service terminals</text>
  <rect x="630" y="320" width="300" height="60" rx="9" class="module"/>
  <text x="780" y="345" class="heading" style="font-size:20px">Owner-checked Unix socket</text>
