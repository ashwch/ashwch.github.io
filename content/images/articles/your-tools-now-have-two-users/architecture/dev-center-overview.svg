<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title description">
  <title id="title">Dev Center: two interfaces, one engine, isolated worktree stacks</title>
  <desc id="description">A developer uses the GPUI window. An agent sends live CLI commands over an owner-checked Unix socket through control.rs and commands.rs. Both call the same service and lifecycle engines in one running app. The app reads the monolith manifest, gets service secrets from 1Password and downloads shared development dumps from Crafting. Its supervisor owns PTY processes, its status builder serves both interfaces, and its local URL router sends registered hostnames to the matching worktree. Each worktree has its own frontend, backend, workers, PostgreSQL, Redis, ports and data folder. The same app runs headless on servers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#716781"/></marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #292333; text-anchor: middle; }
    .title { font-size: 30px; font-weight: 700; text-anchor: start; }
    .heading { font-size: 22px; font-weight: 650; }
    .detail { font-size: 19px; fill: #51495f; }
    .small { font-size: 17px; fill: #62596e; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; fill: #51495f; }
    .line { fill: none; stroke: #716781; stroke-width: 2; marker-end: url(#arrow); stroke-linejoin: round; }
    .input { fill: #fbf0dc; stroke: #ba9b66; stroke-width: 1.5; }
    .surface { fill: #f0eafa; stroke: #b4a0d6; stroke-width: 1.5; }
    .module { fill: #e8edff; stroke: #9693ce; stroke-width: 1.5; }
    .stack { fill: #e9f3ed; stroke: #8fb5a0; stroke-width: 1.5; }
  </style>
  <rect width="1200" height="860" rx="16" fill="#fcf8ff"/>
  <text x="30" y="43" class="title">Dev Center: shared control, isolated stacks</text>
  <text x="30" y="73" class="detail" style="text-anchor:start">One Rust binary. The CLI asks the running app to do the work; it never runs services itself.</text>

