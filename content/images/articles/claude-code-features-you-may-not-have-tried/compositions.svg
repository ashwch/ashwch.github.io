<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Components only, and with compositions</title>
  <desc id="desc">Without compositions, Claude sees buttons, cards and banners in isolation and has to guess the page. With compositions for every page, interaction and variant, a request like the manager's first visit to the home page maps straight to one known variant.</desc>
  <defs>
    <style>
      .title { font: 700 32px "Plus Jakarta Sans", "Helvetica Neue", Inter, Arial, sans-serif; fill: #1b1f3b; }
      .subtitle { font: 600 14px "Helvetica Neue", Inter, Arial, sans-serif; fill: #4e5563; }
      .label { font: 700 18px "Plus Jakarta Sans", "Helvetica Neue", Inter, Arial, sans-serif; fill: #111318; }
      .item { font: 600 14px "Helvetica Neue", Inter, Arial, sans-serif; fill: #2f3640; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2f3640; }
      .small { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #c25a35; letter-spacing: .08em; }
      .msg { font: italic 600 14px "Helvetica Neue", Inter, Arial, sans-serif; fill: #8a3f22; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97757" />
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f1" />
      <stop offset="1" stop-color="#eef3ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b2440" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="520" fill="url(#bg)" />
  <text x="48" y="68" class="title">Components only, and with compositions</text>
  <text x="48" y="94" class="subtitle">"Change the home page a manager sees on their very first visit."</text>

  <!-- left: components only -->
  <rect x="48" y="128" width="410" height="300" rx="16" fill="#e8f0fe" stroke="#4f7fe0" filter="url(#shadow)" stroke-width="1.5" />
  <text x="72" y="162" class="small">COMPONENTS ONLY</text>
  <rect x="72" y="182" width="110" height="44" rx="8" fill="#ffffff" stroke="#d5dceb" filter="url(#shadow)" stroke-width="1.5" />
  <text x="92" y="209" class="item">Button</text>
  <rect x="196" y="182" width="110" height="44" rx="8" fill="#ffffff" stroke="#d5dceb" filter="url(#shadow)" stroke-width="1.5" />
  <text x="216" y="209" class="item">Card</text>
  <rect x="320" y="182" width="114" height="44" rx="8" fill="#ffffff" stroke="#d5dceb" filter="url(#shadow)" stroke-width="1.5" />
  <text x="338" y="209" class="item">Banner</text>
  <rect x="72" y="238" width="110" height="44" rx="8" fill="#ffffff" stroke="#d5dceb" filter="url(#shadow)" stroke-width="1.5" />
  <text x="92" y="265" class="item">Table</text>
  <rect x="196" y="238" width="110" height="44" rx="8" fill="#ffffff" stroke="#d5dceb" filter="url(#shadow)" stroke-width="1.5" />
  <text x="216" y="265" class="item">Nav</text>
  <rect x="320" y="238" width="114" height="44" rx="8" fill="#ffffff" stroke="#d5dceb" filter="url(#shadow)" stroke-width="1.5" />
  <text x="338" y="265" class="item">Chart</text>
  <text x="72" y="322" class="msg">"Which page? Which state? Probably</text>
  <text x="72" y="342" class="msg">something like this…"</text>
  <text x="72" y="386" class="item">Guesses the layout, more mistakes,</text>
  <text x="72" y="406" class="item">more tokens spent exploring.</text>

  <!-- right: compositions -->
  <rect x="502" y="128" width="410" height="300" rx="16" fill="#fdebe3" stroke="#d97757" filter="url(#shadow)" stroke-width="1.5" />
  <text x="526" y="162" class="small">WITH COMPOSITIONS</text>
  <rect x="526" y="182" width="362" height="44" rx="8" fill="#ffffff" stroke="#d5dceb" filter="url(#shadow)" stroke-width="1.5" />
  <text x="546" y="209" class="mono">Home / Manager / Empty</text>
  <rect x="526" y="238" width="362" height="44" rx="8" fill="#fff4ee" stroke="#d97757" stroke-width="2.5" filter="url(#shadow)" />
  <text x="546" y="265" class="mono">Home / Manager / First visit  ✓</text>
  <rect x="526" y="294" width="362" height="44" rx="8" fill="#ffffff" stroke="#d5dceb" filter="url(#shadow)" stroke-width="1.5" />
  <text x="546" y="321" class="mono">Home / Employee / Default</text>
  <text x="526" y="386" class="item">Pulls the exact variant, edits the real</text>
  <text x="526" y="406" class="item">page, far fewer mistakes.</text>

  <text x="48" y="476" class="item">We built compositions for each page, interaction and variant on top of the existing components.</text>
</svg>
